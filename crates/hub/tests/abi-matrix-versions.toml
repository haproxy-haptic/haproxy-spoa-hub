  expected_load = "compatible"

# ----------------------------------------------------------------------
# sso-auth — DEFERRED.
#
# sso-auth's .so links against libxmlsec1 + libxml2 (transitively via
# the `samael` crate, for SAML XML-DSIG operations). The matrix test
# runs in the vanilla `rust:bookworm` image which doesn't include
# those, so `dlopen` of the .so returns "libxmlsec1.so.1: not found".
# Not an ABI issue — it's an unmet system-library dep at link time.
#
# Re-enable once one of:
#   (a) the matrix test's `before_script` apt-installs
#       `libxmlsec1-openssl libxml2`, or
#   (b) the matrix test moves to a custom image that bakes them in.
#
# Crate name diverges from the usual `<short>-plugin` pattern, hence
# the longer `.so` prefix. See LIB_NAMES in
# haptic/scripts/prep-spoa-plugins.sh.
#
# [plugins.sso-auth]
# project = "haproxy-haptic/haproxy-spoa-hub-plugin-sso-auth"
# so_filename = "libhaproxy_spoa_hub_plugin_sso_auth-amd64-glibc2.36.so"
#
#   [[plugins.sso-auth.versions]]
#   version = "v0.2.0"
#   plugin_api_version = 1
#   expected_load = "compatible"
#
#   [[plugins.sso-auth.versions]]
#   version = "v0.3.0"
#   plugin_api_version = 2
#   expected_load = "compatible"
