# ABI compatibility matrix for the hub.
#
# Lists every published plugin version we want to keep loadable on the
# current hub binary. The matrix test (`tests/abi_matrix.rs`)
# downloads each .so from the plugin's GitHub Release and
# asserts the expected behaviour:
#
#   - "compatible":      plugin loads, api_version matches, v1
#                        baseline accessors work, drop runs cleanly.
#   - "forward":         plugin reports a higher api_version than the
#                        hub knows about. Hub uses only the fields it
#                        knows; extras are ignored.
#   - "hard_incompatible": plugin is too old (e.g. built against
#                          plugin-api < 0.4.0 with the abi_stable
#                          prefix-type model). Hub MUST refuse to load
#                          with a clean structured error, not crash.
#
# Schema (per plugin):
#
#   [plugins.<short-name>]
#   project = "haproxy-haptic/haproxy-spoa-hub-plugin-<short-name>"
#   so_filename = "lib<crate>_plugin-<arch>-glibc<ver>.so"
#
#     [[plugins.<short-name>.versions]]
#     version = "v0.4.0"              # plugin's own SemVer git tag,
#                                     #   verbatim — leading "v" is
#                                     #   load-bearing (the release
#                                     #   download path uses it).
#     plugin_api_version = 1          # what the .so reports as api_version
#     expected_load = "compatible"    # see above
#     # Optional sha256 hex of the .so for cache-validation.
#     # sha256 = "abc123..."
#
# Published filename convention:
#
# Each plugin's release CI publishes one `.so` per (arch, glibc) pair
# as a GitHub Release asset. The matrix test runs on Linux
# amd64 only, so `so_filename` is the amd64 + glibc-2.36 variant
# (`-amd64-glibc2.36.so`), e.g. `libcoraza_plugin-amd64-glibc2.36.so`.
# When the upstream build base bumps glibc (tracked by
# `SPOA_PLUGIN_GLIBC_VERSION` in haptic's `versions-spoa.env`), bump
# the suffix in lockstep here.
#
# The sso-auth crate is named `haproxy-spoa-hub-plugin-sso-auth`
# rather than `sso-auth-plugin`, so its `.so` is
# `libhaproxy_spoa_hub_plugin_sso_auth-amd64-glibc2.36.so` rather
# than the usual `lib<short>_plugin-...` shape (see
# `scripts/prep-spoa-plugins.sh` LIB_NAMES table in the haptic repo
# for the upstream-source-of-truth mapping).
#
# Editing rules:
#
# - When a plugin publishes a new version, append a [[versions]] entry
#   below the matching [plugins.<name>] section.
# - When PLUGIN_API_VERSION bumps in this repo, every existing entry
#   stays "compatible" — that's the whole point of the migration.
# - Sha256 sidecars are uploaded alongside .so files by the plugin
#   release CI; copying the value into this file lets the matrix
#   detect cache poisoning or partial downloads. Optional but
#   recommended for stable builds.
#
# The matrix test caches downloaded .so files under
# `target/abi-matrix-cache/` (gitignored) so re-runs are fast.

# ----------------------------------------------------------------------
# coraza — DEFERRED.
#
# coraza's Go-FFI Coraza WAF performs runtime init on `dlopen` (CGo
# allocator + signal-handler installation). In the abi_matrix test
# binary's signal-handler context that init dies with SIGSEGV before
# `create()` returns, which the catch_unwind in the FFI thunk can't
# absorb (catch_unwind only handles Rust panics, not signals). The
# plugin works fine inside the actual hub binary (which sets up its
# tokio runtime and signal mask early), so this is a test-harness
# limitation, not a real ABI break.
#
# Re-enable once the matrix test sandboxes each load in a forked
# child process, so a SIGSEGV in one plugin's init can't bring down
# the test process.
#
# [plugins.coraza]
# project = "haproxy-haptic/haproxy-spoa-hub-plugin-coraza"
# so_filename = "libcoraza_plugin-amd64-glibc2.36.so"
#
#   [[plugins.coraza.versions]]
#   version = "v0.4.2"
#   plugin_api_version = 1
#   expected_load = "compatible"
#
#   [[plugins.coraza.versions]]
#   version = "v0.5.0"
#   plugin_api_version = 2
#   expected_load = "compatible"

# ----------------------------------------------------------------------
# external-auth
# ----------------------------------------------------------------------
[plugins.external-auth]
project = "haproxy-haptic/haproxy-spoa-hub-plugin-external-auth"
so_filename = "libexternal_auth_plugin-amd64-glibc2.36.so"

  [[plugins.external-auth.versions]]
  version = "v0.4.0"
  plugin_api_version = 1
  expected_load = "compatible"

  [[plugins.external-auth.versions]]
  version = "v0.5.0"
  plugin_api_version = 2
  expected_load = "compatible"

