# ----------------------------------------------------------------------
# mirror
# ----------------------------------------------------------------------
[plugins.mirror]
project = "haproxy-haptic/haproxy-spoa-hub-plugin-mirror"
so_filename = "libmirror_plugin-amd64-glibc2.36.so"

  # v0.1.0 was the first plugin to ship against plugin-api 0.5.0 (the
  # hand-rolled #[repr(C)] vtable migration). v0.2.0 added
  # worker_threads + pool_max_idle_per_host knobs; v0.2.1 made
  # request_concurrency auto-size from worker_threads × 512. All
  # three are v1 plugins (api_version=1) — the v2 hub must keep
  # loading every one of them.
  [[plugins.mirror.versions]]
  version = "v0.1.0"
  plugin_api_version = 1
  expected_load = "compatible"

  [[plugins.mirror.versions]]
  version = "v0.2.0"
  plugin_api_version = 1
  expected_load = "compatible"

  [[plugins.mirror.versions]]
  version = "v0.2.1"
  plugin_api_version = 1
  expected_load = "compatible"

  # First v2-consumer release. Full metric set: dispatches_total,
  # dispatch_dropped_total, dispatch_outcomes_total,
  # dispatch_duration_seconds, in_flight.
  [[plugins.mirror.versions]]
  version = "v0.3.0"
  plugin_api_version = 2
  expected_load = "compatible"

