[package]
name = "haproxy-spoa-hub"
version = "0.5.3"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "A dynamic plugin hub for HAProxy SPOE agents"

[lib]
name = "haproxy_spoa_hub"
path = "src/lib.rs"

[[bin]]
name = "haproxy-spoa-hub"
path = "src/main.rs"

[dependencies]
haproxy-spoa-hub-plugin-api = { path = "../plugin-api" }
# Pinned to the same exact version as plugin-api: RString / RVec /
# RHashMap layouts are now part of the FFI contract between hub and
# plugin since abi_stable's load-time check no longer runs. See
# `crates/plugin-api/Cargo.toml` for context.
abi_stable = "=0.11.3"
libloading = "0.9"
spop = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "signal", "macros"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false, features = ["http-listener"] }
toml = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
jsonschema = { version = "0.46", default-features = false }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
arc-swap = "1"
thiserror = "2"
# File-watch on the --config argument so HAPTIC pushing a new config
# triggers reload without needing SIGHUP. See `config_watcher` module
# for why we watch the *parent directory* rather than the file path.
notify = "8"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.8", features = ["html_reports"] }
# Used by the abi_matrix integration test to download plugin .so
# files from the GitLab Generic Package Registry. Blocking client
# keeps the test simple (no tokio runtime needed).
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
sha2 = "0.11"
hex = "0.4"

[[bench]]
name = "dispatch_bench"
harness = false

[[bench]]
name = "conversion_bench"
harness = false

[lints]
workspace = true
