[graph]
all-features = true

[advisories]
# generational-arena and paste are unmaintained transitive deps from abi_stable.
# We can't replace them — ignore until abi_stable updates.
ignore = [
    "RUSTSEC-2024-0014", # generational-arena unmaintained
    "RUSTSEC-2024-0436", # paste unmaintained
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unlicense",
    "Zlib",
    "Unicode-3.0",
]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
