name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  # renovate: datasource=docker depName=rust
  RUST_VERSION: "1.94"
  # renovate: datasource=github-releases depName=EmbarkStudios/cargo-deny
  CARGO_DENY_VERSION: "0.20.2"
  # renovate: datasource=github-releases depName=nextest-rs/nextest
  CARGO_NEXTEST_VERSION: "0.9.100"
  # renovate: datasource=github-releases depName=taiki-e/cargo-llvm-cov
  CARGO_LLVM_COV_VERSION: "0.9.1"
  # 0.7.0+ is required for Rust edition 2024.
  # renovate: datasource=crate depName=cargo-auditable
  CARGO_AUDITABLE_VERSION: "0.7.4"
  # Newer releases require Node.js 20+; matches the haptic repo's pin.
  # renovate: datasource=npm depName=markdownlint-cli2
  MARKDOWNLINT_VERSION: "0.23.3"
  CARGO_INCREMENTAL: "0"
  IMAGE: ghcr.io/haproxy-haptic/haproxy-spoa-hub

jobs:
  # Job containers can't read env, so the pins reach them through outputs.
  versions:
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ env.RUST_VERSION }}
      cargo-auditable: ${{ env.CARGO_AUDITABLE_VERSION }}
    steps:
      - run: echo "rust ${RUST_VERSION}, cargo-auditable ${CARGO_AUDITABLE_VERSION}"

  fmt:
    needs: versions
    runs-on: ubuntu-24.04
    container: rust:${{ needs.versions.outputs.rust }}-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup component add rustfmt
      - run: cargo fmt -- --check

  markdown-lint:
    runs-on: ubuntu-24.04
    container: node:24-alpine
    defaults:
      run:
        shell: sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npx --yes "markdownlint-cli2@${MARKDOWNLINT_VERSION}" "**/*.md"

  clippy:
    needs: versions
    runs-on: ubuntu-24.04
    container: rust:${{ needs.versions.outputs.rust }}-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup component add clippy
      - run: cargo clippy --workspace -- -D warnings

  deny:
    needs: versions
    runs-on: ubuntu-24.04
    container: rust:${{ needs.versions.outputs.rust }}-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          curl -sSfL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz --strip-components=1 -C /usr/local/bin/
      - run: cargo deny check

  test:
    needs: versions
    runs-on: ubuntu-24.04
    container: rust:${{ needs.versions.outputs.rust }}-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup component add llvm-tools-preview
      - run: |
          curl -sSfL "https://get.nexte.st/${CARGO_NEXTEST_VERSION}/linux" | tar -xz -C /usr/local/bin/
          curl -sSfL "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v${CARGO_LLVM_COV_VERSION}/cargo-llvm-cov-x86_64-unknown-linux-musl.tar.gz" \
            | tar -xz -C /usr/local/bin/
      # Integration tests load the plugin .so files from target/debug/; llvm-cov uses its own target dir.
      - run: cargo build --workspace
      - run: cargo llvm-cov nextest --workspace --lcov --output-path lcov.info
      - run: cargo llvm-cov report --summary-only
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: coverage
          path: lcov.info
          retention-days: 7
          if-no-files-found: ignore

  bench:
    needs: versions
    runs-on: ubuntu-24.04
    container: rust:${{ needs.versions.outputs.rust }}-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Benchmarks load the debug plugin .so files from target/debug/.
      - run: cargo build --workspace
      - run: cargo bench -p haproxy-spoa-hub 2>&1 | tee bench-output.txt
      - name: Fail on criterion regression
        run: |
          if grep -q "regressed" bench-output.txt; then
            echo "Benchmark regression detected:"
            grep "regressed" bench-output.txt
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench
          path: |
            bench-output.txt
            target/criterion/
          retention-days: 7
          if-no-files-found: ignore

  doc:
    needs: versions
    runs-on: ubuntu-24.04
    container: rust:${{ needs.versions.outputs.rust }}-bookworm
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo doc --workspace --no-deps

  build:
    needs: versions
    uses: ./.github/workflows/build.yml
    with:
      rust-version: ${{ needs.versions.outputs.rust }}
      cargo-auditable-version: ${{ needs.versions.outputs.cargo-auditable }}

  smoke:
    name: smoke-${{ matrix.arch }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          merge-multiple: true
      # Artifact upload drops the executable bit.
      - run: chmod +x binaries/*/haproxy-spoa-hub
      - run: docker build -t hub:smoke -f Dockerfile .
      - run: scripts/smoke-test-image.sh hub:smoke

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: make -C tests/integration test

  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          merge-multiple: true
      - run: chmod +x binaries/*/haproxy-spoa-hub
      - name: Compute tags
        id: tags
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE}:ci-${GITHUB_RUN_ID}"
            echo "${IMAGE}:main-${GITHUB_SHA::8}"
            echo "EOF"
            echo "version=ci-${GITHUB_RUN_ID}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
