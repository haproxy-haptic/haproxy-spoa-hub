name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, sign, and verify without publishing the release or the crate
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # renovate: datasource=docker depName=rust
  RUST_VERSION: "1.94"
  # 0.7.0+ is required for Rust edition 2024.
  # renovate: datasource=crate depName=cargo-auditable
  CARGO_AUDITABLE_VERSION: "0.7.4"
  # renovate: datasource=docker depName=anchore/syft
  SYFT_VERSION: "v1.52.0"
  IMAGE: ghcr.io/haproxy-haptic/haproxy-spoa-hub
  CERT_IDENTITY: https://github.com/haproxy-haptic/haproxy-spoa-hub/.github/workflows/release.yml@${{ github.ref }}
  CERT_ISSUER: https://token.actions.githubusercontent.com

jobs:
  versions:
    runs-on: ubuntu-24.04
    outputs:
      rust: ${{ env.RUST_VERSION }}
      cargo-auditable: ${{ env.CARGO_AUDITABLE_VERSION }}
    steps:
      - run: echo "rust ${RUST_VERSION}, cargo-auditable ${CARGO_AUDITABLE_VERSION}"

  build:
    needs: versions
    uses: ./.github/workflows/build.yml
    with:
      rust-version: ${{ needs.versions.outputs.rust }}
      cargo-auditable-version: ${{ needs.versions.outputs.cargo-auditable }}

  sign-blobs:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          merge-multiple: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: scripts/sign-release-artifacts.sh
      - name: Write SHA256SUMS
        working-directory: artifacts
        run: |
          : > SHA256SUMS
          for f in *; do
            case "$f" in
              *.sha256 | *.cosign.bundle | SHA256SUMS) continue ;;
            esac
            sha256sum "$f" >> SHA256SUMS
          done
          cat SHA256SUMS
      - name: Verify checksums and signatures
        working-directory: artifacts
        run: |
          sha256sum --check --strict SHA256SUMS
          count=0
          while read -r _ name; do
            sha256sum --check --strict "${name}.sha256"
            cosign verify-blob "${name}" \
              --bundle "${name}.cosign.bundle" \
              --certificate-identity "${CERT_IDENTITY}" \
              --certificate-oidc-issuer "${CERT_ISSUER}"
            count=$((count + 1))
          done < SHA256SUMS
          [ "${count}" -eq 12 ] || { echo "expected 12 artifacts, verified ${count}"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: artifacts/
          if-no-files-found: error

  image:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: build-*
          merge-multiple: true
      # Artifact upload drops the executable bit.
      - run: chmod +x binaries/*/haproxy-spoa-hub
      - name: Compute tags
        id: tags
        run: |
          version="ci-${GITHUB_RUN_ID}"
          {
            echo "tags<<EOF"
            echo "${IMAGE}:ci-${GITHUB_RUN_ID}"
            if [ "${GITHUB_REF_TYPE}" = tag ]; then
              version="${GITHUB_REF_NAME#v}"
              echo "${IMAGE}:${version}"
              if ! echo "${GITHUB_REF_NAME}" | grep -qE -- '-(alpha|beta|rc)'; then
                echo "${IMAGE}:latest"
              fi
            fi
            echo "EOF"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image and attest SBOM
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          ref="${IMAGE}@${DIGEST}"
          cosign sign --yes "${ref}"
          docker run --rm -v "${HOME}/.docker:/docker:ro" -e DOCKER_CONFIG=/docker \
            "anchore/syft:${SYFT_VERSION}" scan "${ref}" -o cyclonedx-json > sbom.cdx.json
          cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "${ref}"
      - name: Verify image signature and SBOM attestation
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          ref="${IMAGE}@${DIGEST}"
          cosign verify "${ref}" \
            --certificate-identity "${CERT_IDENTITY}" --certificate-oidc-issuer "${CERT_ISSUER}" > /dev/null
          cosign verify-attestation --type cyclonedx "${ref}" \
            --certificate-identity "${CERT_IDENTITY}" --certificate-oidc-issuer "${CERT_ISSUER}" > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom.cdx.json
          if-no-files-found: error

  smoke:
    name: smoke-${{ matrix.arch }}
    needs: image
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - env:
          DIGEST: ${{ needs.image.outputs.digest }}
        run: scripts/smoke-test-image.sh "${IMAGE}@${DIGEST}"

  release:
    if: github.event_name == 'push' || !inputs.dry_run
    needs: [sign-blobs, image, smoke]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: artifacts
      - name: Extract release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="${version}" '
            /^## \[/ { if (found) exit; if (index($0, "[" ver "]")) found=1 }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release ${GITHUB_REF_NAME}" > release-notes.md
          fi
          printf '\n- Container image: %s%s:%s%s\n' '`' "${IMAGE}" "${version}" '`' >> release-notes.md
          cat release-notes.md
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --verify-tag \
            --title "${GITHUB_REF_NAME}" --notes-file release-notes.md artifacts/*

  publish-crate:
    needs: [versions, release]
    runs-on: ubuntu-24.04
    container: rust:${{ needs.versions.outputs.rust }}-bookworm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          LOCAL_VERSION=$(cargo metadata --no-deps --format-version=1 \
            | python3 -c "import sys,json; pkgs=json.load(sys.stdin)['packages']; print(next(p['version'] for p in pkgs if p['name']=='haproxy-spoa-hub-plugin-api'))")
          # crates.io returns 403 without a User-Agent, which would make an already-published version look new.
          PUBLISHED=$(curl -sf \
            -H "User-Agent: haproxy-spoa-hub-ci (release pipeline; +https://github.com/haproxy-haptic/haproxy-spoa-hub)" \
            "https://crates.io/api/v1/crates/haproxy-spoa-hub-plugin-api" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['crate']['max_version'])" 2>/dev/null || echo "0.0.0")
          echo "Local: ${LOCAL_VERSION}, Published: ${PUBLISHED}"
          if [ "${LOCAL_VERSION}" = "${PUBLISHED}" ]; then
            echo "Version ${LOCAL_VERSION} already published, skipping"
          else
            cargo publish -p haproxy-spoa-hub-plugin-api
          fi
