[workspace]
resolver = "2"
members = [
    "crates/hub",
    "crates/plugin-api",
    "examples/noop",
    "examples/delay",
    "examples/echo",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
rust-version = "1.86"

[workspace.lints.rust]
dead_code = "warn"
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# elidable_lifetime_names was split from needless_lifetimes in Rust 1.94;
# we suppress both in plugin_trait.rs but need this for workspace consistency
elidable_lifetime_names = "allow"
