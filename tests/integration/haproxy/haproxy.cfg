global
    log stdout format raw local0 debug

defaults
    mode http
    log global
    timeout connect 5s
    timeout client  30s
    timeout server  30s

frontend http-in
    bind *:8080
    filter spoe engine spoa-hub config /etc/haproxy/spoe-hub.conf
    default_backend reply

backend reply
    http-request return status 200 content-type "text/plain" string "ok\n"

backend spoa-hub-backend
    mode tcp
    server hub /var/run/spoe/hub.sock
