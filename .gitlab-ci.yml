stages:
  - check
  - build
  - release

# Prevent duplicate pipelines for MR and branch pushes
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  # renovate: datasource=docker depName=rust
  RUST_VERSION: "1.94"
  # renovate: datasource=docker depName=docker
  DOCKER_VERSION: "29"
  # renovate: datasource=github-releases depName=EmbarkStudios/cargo-deny
  CARGO_DENY_VERSION: "0.19.0"
  # renovate: datasource=github-releases depName=nextest-rs/nextest
  CARGO_NEXTEST_VERSION: "0.9.100"
  # renovate: datasource=github-releases depName=taiki-e/cargo-llvm-cov
  CARGO_LLVM_COV_VERSION: "0.6.14"
  CARGO_INCREMENTAL: "0"
  CI_REGISTRY_IMAGE: registry.gitlab.com/haproxy-haptic/haproxy-spoa-hub

# Reusable rules for path-based filtering
.rules-code:
  rules:
    - changes:
        - "**/*.rs"
        - Cargo.toml
        - Cargo.lock
        - rustfmt.toml
        - deny.toml
        - .cargo/**
        - .gitlab-ci.yml

# Docker-in-Docker base configuration
.docker-dind:
  services:
    - name: docker:${DOCKER_VERSION}-dind
      alias: docker
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_HOST: tcp://docker:2376
  retry:
    max: 2
    when: runner_system_failure

# =============================================================================
# Check Stage — all jobs start immediately in parallel (DAG: needs: [])
# =============================================================================

fmt:
  stage: check
  image: rust:${RUST_VERSION}-bookworm
  tags:
    - saas-linux-small-amd64
  needs: []
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - !reference [.rules-code, rules]
  interruptible: true
  before_script:
    - rustup component add rustfmt
  script:
    - cargo fmt -- --check

clippy:
  stage: check
  image: rust:${RUST_VERSION}-bookworm
  tags:
    - saas-linux-large-amd64
  needs: []
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - !reference [.rules-code, rules]
  interruptible: true
  script:
    - rustup component add clippy
    - cargo clippy --workspace -- -D warnings

deny:
  stage: check
  image: rust:${RUST_VERSION}-bookworm
  tags:
    - saas-linux-small-amd64
  needs: []
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - !reference [.rules-code, rules]
  interruptible: true
  before_script:
    - curl -sSL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
      | tar -xz --strip-components=1 -C /usr/local/bin/
  script:
    - cargo deny check

test:
  stage: check
  image: rust:${RUST_VERSION}-bookworm
  tags:
    - saas-linux-xlarge-amd64
  needs: []
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - !reference [.rules-code, rules]
  interruptible: true
  before_script:
    - rustup component add llvm-tools-preview
    # Pre-built binaries — avoid 3-4min cargo install compilation
    - curl -sSL "https://get.nexte.st/${CARGO_NEXTEST_VERSION}/linux" | tar -xz -C /usr/local/bin/
    - curl -sSL "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v${CARGO_LLVM_COV_VERSION}/cargo-llvm-cov-x86_64-unknown-linux-musl.tar.gz"
      | tar -xz -C /usr/local/bin/
  script:
    # Build plugins into target/debug/ first — integration tests load .so
    # files from there at runtime, but llvm-cov uses a separate target dir
    - cargo build --workspace
    - cargo llvm-cov nextest --workspace --lcov --output-path lcov.info
    - cargo llvm-cov report --summary-only
  coverage: '/TOTAL\s+\d+\s+\d+\s+([\d.]+%)/'
  artifacts:
    paths:
      - lcov.info
    reports:
      coverage_report:
        coverage_format: cobertura
        path: lcov.info
    expire_in: 1 week
    when: always

bench:
  stage: check
  image: rust:${RUST_VERSION}-bookworm
  tags:
    - saas-linux-large-amd64
  needs: []
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - !reference [.rules-code, rules]
  interruptible: true
  script:
    # Build debug plugins first (benchmarks load .so from target/debug/)
    - cargo build --workspace
    - cargo bench -p haproxy-spoa-hub 2>&1 | tee bench-output.txt
    # Fail if criterion detected a regression
    - |
      if grep -q "regressed" bench-output.txt; then
        echo "Benchmark regression detected:"
        grep "regressed" bench-output.txt
        exit 1
      fi
  artifacts:
    paths:
      - bench-output.txt
      - target/criterion/
    expire_in: 1 week

doc:
  stage: check
  image: rust:${RUST_VERSION}-bookworm
  tags:
    - saas-linux-large-amd64
  needs: []
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - !reference [.rules-code, rules]
  interruptible: true
  variables:
    RUSTDOCFLAGS: "-D warnings"
  script:
    - cargo doc --workspace --no-deps

# =============================================================================
# Build Stage — starts immediately alongside checks (DAG)
# =============================================================================

# Shared template for multiarch cross-compilation jobs
.build-arch:
  stage: build
  image: rust:${RUST_VERSION}-bookworm
  needs: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - !reference [.rules-code, rules]
  interruptible: true
  artifacts:
    paths:
      - binaries/
    expire_in: 1 week

build-amd64:
  extends: .build-arch
  tags:
    - saas-linux-xlarge-amd64
  script:
    - cargo build --release --workspace
    - mkdir -p binaries/amd64
    - cp target/release/haproxy-spoa-hub binaries/amd64/
    - cp target/release/libnoop_plugin.so binaries/amd64/
    - cp target/release/libecho_plugin.so binaries/amd64/
    - cp target/release/libdelay_plugin.so binaries/amd64/

build-arm64:
  extends: .build-arch
  tags:
    - saas-linux-xlarge-amd64
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
    - rustup target add aarch64-unknown-linux-gnu
  variables:
    CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
  script:
    - cargo build --release --workspace --target aarch64-unknown-linux-gnu
    - mkdir -p binaries/arm64
    - cp target/aarch64-unknown-linux-gnu/release/haproxy-spoa-hub binaries/arm64/
    - cp target/aarch64-unknown-linux-gnu/release/libnoop_plugin.so binaries/arm64/
    - cp target/aarch64-unknown-linux-gnu/release/libecho_plugin.so binaries/arm64/
    - cp target/aarch64-unknown-linux-gnu/release/libdelay_plugin.so binaries/arm64/

build-armv7:
  extends: .build-arch
  tags:
    - saas-linux-xlarge-amd64
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
    - rustup target add armv7-unknown-linux-gnueabihf
  variables:
    CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
  script:
    - cargo build --release --workspace --target armv7-unknown-linux-gnueabihf
    - mkdir -p binaries/armv7
    - cp target/armv7-unknown-linux-gnueabihf/release/haproxy-spoa-hub binaries/armv7/
    - cp target/armv7-unknown-linux-gnueabihf/release/libnoop_plugin.so binaries/armv7/
    - cp target/armv7-unknown-linux-gnueabihf/release/libecho_plugin.so binaries/armv7/
    - cp target/armv7-unknown-linux-gnueabihf/release/libdelay_plugin.so binaries/armv7/

build-docker:
  stage: build
  image: docker:${DOCKER_VERSION}
  extends: .docker-dind
  tags:
    - saas-linux-xlarge-amd64
  needs:
    - build-amd64
    - build-arm64
    - build-armv7
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - !reference [.rules-code, rules]
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker context create tls-env --docker "host=${DOCKER_HOST},ca=${DOCKER_CERT_PATH}/ca.pem,cert=${DOCKER_CERT_PATH}/cert.pem,key=${DOCKER_CERT_PATH}/key.pem"
    - docker buildx create --use --name multiarch --driver docker-container tls-env
    - docker run --rm --privileged tonistiigi/binfmt --install arm64,arm
  script:
    # Determine image tags: release versions for tags, main-{sha} for main,
    # ci-{pipeline_id} for branch pipelines (consumed by smoke tests, then cleaned up)
    - |
      TAGS="--tag ${CI_REGISTRY_IMAGE}:ci-${CI_PIPELINE_ID}"
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG="${CI_COMMIT_TAG#v}"
        TAGS="${TAGS} --tag ${CI_REGISTRY_IMAGE}:${IMAGE_TAG}"
        if ! echo "$CI_COMMIT_TAG" | grep -qE -- '-(alpha|beta|rc)'; then
          TAGS="${TAGS} --tag ${CI_REGISTRY_IMAGE}:latest"
        fi
      elif [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        TAGS="${TAGS} --tag ${CI_REGISTRY_IMAGE}:main-${CI_COMMIT_SHORT_SHA}"
      fi
    - |
      docker buildx build \
        --platform linux/amd64,linux/arm64,linux/arm/v7 \
        ${TAGS} \
        --label "org.opencontainers.image.source=${CI_PROJECT_URL}" \
        --label "org.opencontainers.image.revision=${CI_COMMIT_SHA}" \
        --label "org.opencontainers.image.version=${IMAGE_TAG:-ci-${CI_PIPELINE_ID}}" \
        --push \
        -f Dockerfile \
        .

# Smoke tests: pull the multiarch image from the registry on native runners
# and verify the hub starts, loads plugins, and binds a TCP listener.
.smoke-test:
  stage: build
  image: docker:${DOCKER_VERSION}
  extends: .docker-dind
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - !reference [.rules-code, rules]
  needs:
    - build-docker
  interruptible: true
  timeout: 5 minutes
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker pull "${CI_REGISTRY_IMAGE}:ci-${CI_PIPELINE_ID}"
    # Verify --help works (catches missing libraries / wrong arch)
    - docker run --rm "${CI_REGISTRY_IMAGE}:ci-${CI_PIPELINE_ID}" --help
    # Build a derived image with a minimal TCP config baked in
    - |
      docker build -t smoke-hub - <<DOCKERFILE
      FROM ${CI_REGISTRY_IMAGE}:ci-${CI_PIPELINE_ID}
      RUN printf '%s\n' \
        'plugin_dir = "/etc/haproxy-spoa-hub/plugins"' \
        'default_timeout_ms = 500' \
        'log_level = "debug"' \
        '[[listeners]]' \
        'type = "tcp"' \
        'address = "0.0.0.0:12345"' \
        '[[plugins]]' \
        'name = "noop"' \
        'library = "libnoop_plugin.so"' \
        'messages = ["check-request"]' \
        > /etc/haproxy-spoa-hub/config.toml
      DOCKERFILE
    - docker run -d --name smoke-hub smoke-hub
    # Wait for the TCP listener to be ready
    - |
      for i in $(seq 1 15); do
        if [ "$(docker inspect -f '{{.State.Running}}' smoke-hub 2>/dev/null)" != "true" ]; then
          echo "FAIL: container exited unexpectedly"
          docker logs smoke-hub
          exit 1
        fi
        if docker logs smoke-hub 2>&1 | grep -q "listening"; then
          echo "Hub is listening"
          break
        fi
        if [ "$i" -eq 15 ]; then
          echo "FAIL: hub did not start listening within 15s"
          docker logs smoke-hub
          exit 1
        fi
        sleep 1
      done
    # Verify plugin was loaded
    - docker logs smoke-hub 2>&1 | grep "plugin loaded"
    - echo "PASS - smoke test"
    - docker stop smoke-hub

smoke-amd64:
  extends: .smoke-test
  tags:
    - saas-linux-small-amd64

smoke-arm64:
  extends: .smoke-test
  tags:
    - saas-linux-small-arm64
  # Workaround for MTU mismatch on GitLab hosted arm64 runners
  services:
    - name: docker:${DOCKER_VERSION}-dind
      alias: docker
      command: ["--mtu=1400"]

integration:
  stage: build
  image: docker:${DOCKER_VERSION}
  extends: .docker-dind
  tags:
    - saas-linux-xlarge-amd64
  needs:
    - job: build-docker
      artifacts: false
      optional: true
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - !reference [.rules-code, rules]
  timeout: 15 minutes
  interruptible: true
  script:
    - apk add --no-cache make bash curl
    - cd tests/integration
    - make test
  artifacts:
    when: on_failure
    expire_in: 1 week

# =============================================================================
# Release Stage (triggered by v* tags)
# =============================================================================

publish-crate:
  stage: release
  image: rust:${RUST_VERSION}-bookworm
  tags:
    - saas-linux-small-amd64
  needs: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
  script:
    - |
      LOCAL_VERSION=$(cargo metadata --no-deps --format-version=1 \
        | python3 -c "import sys,json; pkgs=json.load(sys.stdin)['packages']; print(next(p['version'] for p in pkgs if p['name']=='haproxy-spoa-hub-plugin-api'))")
      PUBLISHED=$(curl -sf "https://crates.io/api/v1/crates/haproxy-spoa-hub-plugin-api" \
        | python3 -c "import sys,json; print(json.load(sys.stdin)['crate']['max_version'])" 2>/dev/null || echo "0.0.0")
      echo "Local: ${LOCAL_VERSION}, Published: ${PUBLISHED}"
      if [ "${LOCAL_VERSION}" = "${PUBLISHED}" ]; then
        echo "Version ${LOCAL_VERSION} already published, skipping"
      else
        cargo publish -p haproxy-spoa-hub-plugin-api
      fi
  variables:
    CARGO_REGISTRY_TOKEN: $CARGO_REGISTRY_TOKEN

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - saas-linux-small-amd64
  needs:
    - build-amd64
    - build-arm64
    - build-armv7
    - build-docker
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
  variables:
    GIT_DEPTH: 0
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      awk -v ver="${VERSION}" '
        /^## \[/ { if (found) exit; if (index($0, "[" ver "]")) found=1 }
        found { print }
      ' CHANGELOG.md > /tmp/release-notes.md
      if [ ! -s /tmp/release-notes.md ]; then
        echo "Release ${CI_COMMIT_TAG}" > /tmp/release-notes.md
      fi
      cat /tmp/release-notes.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: "$CI_COMMIT_TAG"
    description: /tmp/release-notes.md
    assets:
      links:
        - name: "Docker Image"
          url: "https://gitlab.com/haproxy-haptic/haproxy-spoa-hub/container_registry"
          link_type: image
