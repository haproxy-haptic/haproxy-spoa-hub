stages:
  - check
  - build
  - release

# Prevent duplicate pipelines for MR and branch pushes
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  # renovate: datasource=docker depName=rust
  RUST_VERSION: "1.85"
  # renovate: datasource=docker depName=docker
  DOCKER_VERSION: "29"
  # renovate: datasource=github-releases depName=EmbarkStudios/cargo-deny
  CARGO_DENY_VERSION: "0.19.0"
  # renovate: datasource=github-releases depName=nextest-rs/nextest
  CARGO_NEXTEST_VERSION: "0.9.100"
  # renovate: datasource=github-releases depName=taiki-e/cargo-llvm-cov
  CARGO_LLVM_COV_VERSION: "0.6.14"
  CARGO_INCREMENTAL: "0"
  CI_REGISTRY_IMAGE: registry.gitlab.com/haproxy-haptic/haproxy-spoa-hub

# Reusable rules for path-based filtering
.rules-code:
  rules:
    - changes:
        - "**/*.rs"
        - Cargo.toml
        - Cargo.lock
        - rustfmt.toml
        - deny.toml
        - .cargo/**
        - .gitlab-ci.yml

# Docker-in-Docker base configuration
.docker-dind:
  services:
    - name: docker:${DOCKER_VERSION}-dind
      alias: docker
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_HOST: tcp://docker:2376
  retry:
    max: 2
    when: runner_system_failure

# =============================================================================
# Check Stage — all jobs start immediately in parallel (DAG: needs: [])
# =============================================================================

fmt:
  stage: check
  image: rust:${RUST_VERSION}-bookworm
  tags:
    - saas-linux-small-amd64
  needs: []
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - !reference [.rules-code, rules]
  interruptible: true
  before_script:
    - rustup component add rustfmt
  script:
    - cargo fmt -- --check

clippy:
  stage: check
  image: rust:${RUST_VERSION}-bookworm
  tags:
    - saas-linux-large-amd64
  needs: []
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - !reference [.rules-code, rules]
  interruptible: true
  script:
    - rustup component add clippy
    - cargo clippy --workspace -- -D warnings

deny:
  stage: check
  image: rust:${RUST_VERSION}-bookworm
  tags:
    - saas-linux-small-amd64
  needs: []
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - !reference [.rules-code, rules]
  interruptible: true
  before_script:
    - curl -sSL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
      | tar -xz --strip-components=1 -C /usr/local/bin/
  script:
    - cargo deny check

test:
  stage: check
  image: rust:${RUST_VERSION}-bookworm
  tags:
    - saas-linux-xlarge-amd64
  needs: []
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - !reference [.rules-code, rules]
  interruptible: true
  before_script:
    - rustup component add llvm-tools-preview
    # Pre-built binaries — avoid 3-4min cargo install compilation
    - curl -sSL "https://get.nexte.st/${CARGO_NEXTEST_VERSION}/linux" | tar -xz -C /usr/local/bin/
    - curl -sSL "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v${CARGO_LLVM_COV_VERSION}/cargo-llvm-cov-x86_64-unknown-linux-musl.tar.gz"
      | tar -xz -C /usr/local/bin/
  script:
    # Build plugins into target/debug/ first — integration tests load .so
    # files from there at runtime, but llvm-cov uses a separate target dir
    - cargo build --workspace
    - cargo llvm-cov nextest --workspace --lcov --output-path lcov.info
    - cargo llvm-cov report --summary-only
  coverage: '/TOTAL\s+\d+\s+\d+\s+([\d.]+%)/'
  artifacts:
    paths:
      - lcov.info
    reports:
      coverage_report:
        coverage_format: cobertura
        path: lcov.info
    expire_in: 1 week
    when: always

bench:
  stage: check
  image: rust:${RUST_VERSION}-bookworm
  tags:
    - saas-linux-large-amd64
  needs: []
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - !reference [.rules-code, rules]
  interruptible: true
  script:
    # Build debug plugins first (benchmarks load .so from target/debug/)
    - cargo build --workspace
    - cargo bench -p haproxy-spoa-hub 2>&1 | tee bench-output.txt
  artifacts:
    paths:
      - bench-output.txt
      - target/criterion/
    expire_in: 1 week

doc:
  stage: check
  image: rust:${RUST_VERSION}-bookworm
  tags:
    - saas-linux-large-amd64
  needs: []
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - !reference [.rules-code, rules]
  interruptible: true
  variables:
    RUSTDOCFLAGS: "-D warnings"
  script:
    - cargo doc --workspace --no-deps

# =============================================================================
# Build Stage — starts immediately alongside checks (DAG)
# =============================================================================

build:
  stage: build
  image: rust:${RUST_VERSION}-bookworm
  tags:
    - saas-linux-xlarge-amd64
  needs: []
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - !reference [.rules-code, rules]
  interruptible: true
  script:
    - cargo build --release --workspace
    - ls -lh target/release/haproxy-spoa-hub
    - ls -lh target/release/lib*.so
  artifacts:
    paths:
      - target/release/haproxy-spoa-hub
      - target/release/libnoop_plugin.so
      - target/release/libdelay_plugin.so
      - target/release/libecho_plugin.so
    expire_in: 1 week

build-docker:
  stage: build
  image: docker:${DOCKER_VERSION}
  extends: .docker-dind
  tags:
    - saas-linux-xlarge-amd64
  needs: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG="${CI_COMMIT_TAG#v}"
      else
        IMAGE_TAG="main-${CI_COMMIT_SHORT_SHA}"
      fi
    - |
      docker build \
        --tag "${CI_REGISTRY_IMAGE}:${IMAGE_TAG}" \
        --label "org.opencontainers.image.source=${CI_PROJECT_URL}" \
        --label "org.opencontainers.image.revision=${CI_COMMIT_SHA}" \
        --label "org.opencontainers.image.version=${IMAGE_TAG}" \
        -f tests/integration/Dockerfile.hub \
        .
    - docker push "${CI_REGISTRY_IMAGE}:${IMAGE_TAG}"
    # Tag as latest for stable releases
    - |
      if [ -n "$CI_COMMIT_TAG" ] && ! echo "$CI_COMMIT_TAG" | grep -qE -- '-(alpha|beta|rc)'; then
        docker tag "${CI_REGISTRY_IMAGE}:${IMAGE_TAG}" "${CI_REGISTRY_IMAGE}:latest"
        docker push "${CI_REGISTRY_IMAGE}:latest"
      fi

integration:
  stage: build
  image: docker:${DOCKER_VERSION}
  extends: .docker-dind
  tags:
    - saas-linux-xlarge-amd64
  needs:
    - job: build-docker
      artifacts: false
      optional: true
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - !reference [.rules-code, rules]
  timeout: 15 minutes
  interruptible: true
  script:
    - apk add --no-cache make bash curl
    - cd tests/integration
    - make test
  artifacts:
    when: on_failure
    expire_in: 1 week

# =============================================================================
# Release Stage (triggered by v* tags)
# =============================================================================

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - saas-linux-small-amd64
  needs:
    - build
    - build-docker
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
  variables:
    GIT_DEPTH: 0
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      awk -v ver="${VERSION}" '
        /^## \[/ { if (found) exit; if (index($0, "[" ver "]")) found=1 }
        found { print }
      ' CHANGELOG.md > /tmp/release-notes.md
      if [ ! -s /tmp/release-notes.md ]; then
        echo "Release ${CI_COMMIT_TAG}" > /tmp/release-notes.md
      fi
      cat /tmp/release-notes.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: "$CI_COMMIT_TAG"
    description: /tmp/release-notes.md
    assets:
      links:
        - name: "Docker Image"
          url: "https://gitlab.com/haproxy-haptic/haproxy-spoa-hub/container_registry"
          link_type: image

create-release-tag:
  stage: release
  image: alpine/git:latest
  tags:
    - saas-linux-small-amd64
  needs: []
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - CHANGELOG.md
  script:
    - |
      VERSION=$(grep '^version' crates/hub/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
      TAG="v${VERSION}"
    - |
      if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
        echo "Tag ${TAG} already exists, skipping"
        exit 0
      fi
    - git config user.email "ci@gitlab.com"
    - git config user.name "GitLab CI"
    - git tag -a "${TAG}" -m "Release ${VERSION}"
    - git push "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" "${TAG}"
    - echo "Created and pushed tag ${TAG}"
