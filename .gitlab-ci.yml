stages:
  - check
  - build
  - sign
  - upload
  - release

# Prevent duplicate pipelines for MR and branch pushes
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  # renovate: datasource=docker depName=rust
  RUST_VERSION: "1.94"
  # renovate: datasource=docker depName=docker
  DOCKER_VERSION: "29"
  # renovate: datasource=github-releases depName=EmbarkStudios/cargo-deny
  CARGO_DENY_VERSION: "0.19.0"
  # renovate: datasource=github-releases depName=nextest-rs/nextest
  CARGO_NEXTEST_VERSION: "0.9.100"
  # renovate: datasource=github-releases depName=taiki-e/cargo-llvm-cov
  CARGO_LLVM_COV_VERSION: "0.6.14"
  # renovate: datasource=crate depName=cargo-auditable
  # 0.7.0+ required for Rust edition 2024 support (used by this workspace).
  CARGO_AUDITABLE_VERSION: "0.7.4"
  # renovate: datasource=npm depName=markdownlint-cli2
  # Pinned to 0.14.0 — newer versions require Node.js 20+. Matches the
  # haproxy-haptic group's haptic repo so writing-style rules are
  # consistent across repos.
  MARKDOWNLINT_VERSION: "0.14.0"
  # Glibc version baked into the Debian bookworm rust:bookworm builder image;
  # stamped into release-artifact filenames so consumers can pick a
  # binary-compatible build for their runtime.
  GLIBC_VERSION: "2.36"
  CARGO_INCREMENTAL: "0"
  CI_REGISTRY_IMAGE: registry.gitlab.com/haproxy-haptic/haproxy-spoa-hub
  # Generic Package Registry path used as the durable home for release
  # artifacts. Asset links in the GitLab Release point into this URL.
  PKG_NAME: spoa-hub
  PKG_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PKG_NAME}/${CI_COMMIT_TAG}"

# Reusable rules for path-based filtering
.rules-code:
  rules:
    - changes:
        - "**/*.rs"
        - Cargo.toml
        - Cargo.lock
        - rustfmt.toml
        - deny.toml
        - .cargo/**
        - .gitlab-ci.yml
        - renovate.json

# Markdown / documentation paths. Drives the markdown-lint job below so
# spec-only and doc-only branches still trigger CI — without this rule,
# spec-only MRs end up with no head pipeline at all (workflow rule
# matches but no job filters do), which blocks merge under the project's
# "merge requires pipeline success" setting.
.rules-docs:
  rules:
    - changes:
        - "**/*.md"
        - .markdownlint-cli2.jsonc
        - .gitlab-ci.yml

# Docker-in-Docker base configuration
.docker-dind:
  services:
    - name: docker:${DOCKER_VERSION}-dind
      alias: docker
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_HOST: tcp://docker:2376
  retry:
    max: 2
    when: runner_system_failure

# =============================================================================
# Check Stage — all jobs start immediately in parallel (DAG: needs: [])
# =============================================================================

fmt:
  stage: check
  image: rust:${RUST_VERSION}-bookworm
  tags:
    - saas-linux-small-amd64
  needs: []
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - !reference [.rules-code, rules]
  interruptible: true
  before_script:
    - rustup component add rustfmt
  script:
    - cargo fmt -- --check

markdown-lint:
  stage: check
  image: node:24-alpine
  tags:
    - saas-linux-small-amd64
  needs: []
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - !reference [.rules-docs, rules]
  interruptible: true
  script:
    - npx --yes markdownlint-cli2@${MARKDOWNLINT_VERSION} "**/*.md"

clippy:
  stage: check
  image: rust:${RUST_VERSION}-bookworm
  tags:
    - saas-linux-large-amd64
  needs: []
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - !reference [.rules-code, rules]
  interruptible: true
  script:
    - rustup component add clippy
    - cargo clippy --workspace -- -D warnings

deny:
  stage: check
  image: rust:${RUST_VERSION}-bookworm
  tags:
    - saas-linux-small-amd64
  needs: []
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - !reference [.rules-code, rules]
  interruptible: true
  before_script:
    - curl -sSL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz"
      | tar -xz --strip-components=1 -C /usr/local/bin/
  script:
    - cargo deny check

test:
  stage: check
  image: rust:${RUST_VERSION}-bookworm
  tags:
    - saas-linux-xlarge-amd64
  needs: []
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - !reference [.rules-code, rules]
  interruptible: true
  before_script:
    - rustup component add llvm-tools-preview
    # Pre-built binaries — avoid 3-4min cargo install compilation
    - curl -sSL "https://get.nexte.st/${CARGO_NEXTEST_VERSION}/linux" | tar -xz -C /usr/local/bin/
    - curl -sSL "https://github.com/taiki-e/cargo-llvm-cov/releases/download/v${CARGO_LLVM_COV_VERSION}/cargo-llvm-cov-x86_64-unknown-linux-musl.tar.gz"
      | tar -xz -C /usr/local/bin/
  script:
    # Build plugins into target/debug/ first — integration tests load .so
    # files from there at runtime, but llvm-cov uses a separate target dir
    - cargo build --workspace
    - cargo llvm-cov nextest --workspace --lcov --output-path lcov.info
    - cargo llvm-cov report --summary-only
  coverage: '/TOTAL\s+\d+\s+\d+\s+([\d.]+%)/'
  artifacts:
    paths:
      - lcov.info
    reports:
      coverage_report:
        coverage_format: cobertura
        path: lcov.info
    expire_in: 1 week
    when: always

bench:
  stage: check
  image: rust:${RUST_VERSION}-bookworm
  tags:
    - saas-linux-large-amd64
  needs: []
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - !reference [.rules-code, rules]
  interruptible: true
  script:
    # Build debug plugins first (benchmarks load .so from target/debug/)
    - cargo build --workspace
    - cargo bench -p haproxy-spoa-hub 2>&1 | tee bench-output.txt
    # Fail if criterion detected a regression
    - |
      if grep -q "regressed" bench-output.txt; then
        echo "Benchmark regression detected:"
        grep "regressed" bench-output.txt
        exit 1
      fi
  artifacts:
    paths:
      - bench-output.txt
      - target/criterion/
    expire_in: 1 week

doc:
  stage: check
  image: rust:${RUST_VERSION}-bookworm
  tags:
    - saas-linux-large-amd64
  needs: []
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - !reference [.rules-code, rules]
  interruptible: true
  variables:
    RUSTDOCFLAGS: "-D warnings"
  script:
    - cargo doc --workspace --no-deps

# =============================================================================
# Build Stage — starts immediately alongside checks (DAG)
# =============================================================================

# Shared template for multiarch cross-compilation jobs
.build-arch:
  stage: build
  image: rust:${RUST_VERSION}-bookworm
  needs: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - !reference [.rules-code, rules]
  interruptible: true
  variables:
    # Emit unsigned SLSA v0.2 provenance alongside artifacts (free SLSA-L1).
    RUNNER_GENERATE_ARTIFACTS_METADATA: "true"
  before_script:
    # cargo-auditable embeds a compressed Cargo.lock-equivalent in the binary
    # so syft + grype can enumerate Rust deps from the published .so files
    # without source access. Compiled from crates.io for portability — the
    # one-time ~1min cost is amortized via the .build-arch artifact cache.
    - cargo install --locked "cargo-auditable@${CARGO_AUDITABLE_VERSION}"
  artifacts:
    paths:
      - binaries/
      - artifacts/
    expire_in: 1 week

build-amd64:
  extends: .build-arch
  tags:
    - saas-linux-xlarge-amd64
  variables:
    ARCH: amd64
  script:
    - cargo auditable build --release --workspace
    - mkdir -p binaries/${ARCH}
    - cp target/release/haproxy-spoa-hub binaries/${ARCH}/
    - cp target/release/libnoop_plugin.so binaries/${ARCH}/
    - cp target/release/libecho_plugin.so binaries/${ARCH}/
    - cp target/release/libdelay_plugin.so binaries/${ARCH}/
    - scripts/stage-release-artifacts.sh

build-arm64:
  extends: .build-arch
  tags:
    - saas-linux-xlarge-amd64
  before_script:
    - !reference [.build-arch, before_script]
    - apt-get update && apt-get install -y --no-install-recommends gcc-aarch64-linux-gnu libc6-dev-arm64-cross
    - rustup target add aarch64-unknown-linux-gnu
  variables:
    ARCH: arm64
    CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
  script:
    - cargo auditable build --release --workspace --target aarch64-unknown-linux-gnu
    - mkdir -p binaries/${ARCH}
    - cp target/aarch64-unknown-linux-gnu/release/haproxy-spoa-hub binaries/${ARCH}/
    - cp target/aarch64-unknown-linux-gnu/release/libnoop_plugin.so binaries/${ARCH}/
    - cp target/aarch64-unknown-linux-gnu/release/libecho_plugin.so binaries/${ARCH}/
    - cp target/aarch64-unknown-linux-gnu/release/libdelay_plugin.so binaries/${ARCH}/
    - scripts/stage-release-artifacts.sh

build-armv7:
  extends: .build-arch
  tags:
    - saas-linux-xlarge-amd64
  before_script:
    - !reference [.build-arch, before_script]
    - apt-get update && apt-get install -y --no-install-recommends gcc-arm-linux-gnueabihf libc6-dev-armhf-cross
    - rustup target add armv7-unknown-linux-gnueabihf
  variables:
    ARCH: armv7
    CARGO_TARGET_ARMV7_UNKNOWN_LINUX_GNUEABIHF_LINKER: arm-linux-gnueabihf-gcc
  script:
    - cargo auditable build --release --workspace --target armv7-unknown-linux-gnueabihf
    - mkdir -p binaries/${ARCH}
    - cp target/armv7-unknown-linux-gnueabihf/release/haproxy-spoa-hub binaries/${ARCH}/
    - cp target/armv7-unknown-linux-gnueabihf/release/libnoop_plugin.so binaries/${ARCH}/
    - cp target/armv7-unknown-linux-gnueabihf/release/libecho_plugin.so binaries/${ARCH}/
    - cp target/armv7-unknown-linux-gnueabihf/release/libdelay_plugin.so binaries/${ARCH}/
    - scripts/stage-release-artifacts.sh

build-docker:
  stage: build
  image: docker:${DOCKER_VERSION}
  extends: .docker-dind
  tags:
    - saas-linux-xlarge-amd64
  needs:
    - build-amd64
    - build-arm64
    - build-armv7
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - !reference [.rules-code, rules]
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker context create tls-env --docker "host=${DOCKER_HOST},ca=${DOCKER_CERT_PATH}/ca.pem,cert=${DOCKER_CERT_PATH}/cert.pem,key=${DOCKER_CERT_PATH}/key.pem"
    - docker buildx create --use --name multiarch --driver docker-container tls-env
    - docker run --rm --privileged tonistiigi/binfmt --install arm64,arm
  script:
    # Determine image tags: release versions for tags, main-{sha} for main,
    # ci-{pipeline_id} for branch pipelines (consumed by smoke tests, then cleaned up)
    - |
      TAGS="--tag ${CI_REGISTRY_IMAGE}:ci-${CI_PIPELINE_ID}"
      if [ -n "$CI_COMMIT_TAG" ]; then
        IMAGE_TAG="${CI_COMMIT_TAG#v}"
        TAGS="${TAGS} --tag ${CI_REGISTRY_IMAGE}:${IMAGE_TAG}"
        if ! echo "$CI_COMMIT_TAG" | grep -qE -- '-(alpha|beta|rc)'; then
          TAGS="${TAGS} --tag ${CI_REGISTRY_IMAGE}:latest"
        fi
      elif [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        TAGS="${TAGS} --tag ${CI_REGISTRY_IMAGE}:main-${CI_COMMIT_SHORT_SHA}"
      fi
    - |
      docker buildx build \
        --platform linux/amd64,linux/arm64,linux/arm/v7 \
        ${TAGS} \
        --label "org.opencontainers.image.source=${CI_PROJECT_URL}" \
        --label "org.opencontainers.image.revision=${CI_COMMIT_SHA}" \
        --label "org.opencontainers.image.version=${IMAGE_TAG:-ci-${CI_PIPELINE_ID}}" \
        --push \
        --metadata-file metadata.json \
        -f Dockerfile \
        .
  artifacts:
    paths:
      - metadata.json
    expire_in: 1 week

# Smoke tests: pull the multiarch image from the registry on native runners
# and verify the hub starts, loads plugins, and binds a TCP listener.
.smoke-test:
  stage: build
  image: docker:${DOCKER_VERSION}
  extends: .docker-dind
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - !reference [.rules-code, rules]
  needs:
    - build-docker
  interruptible: true
  timeout: 5 minutes
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker pull "${CI_REGISTRY_IMAGE}:ci-${CI_PIPELINE_ID}"
    # Verify --help works (catches missing libraries / wrong arch)
    - docker run --rm "${CI_REGISTRY_IMAGE}:ci-${CI_PIPELINE_ID}" --help
    # Build a derived image with a minimal TCP config baked in
    - |
      docker build -t smoke-hub - <<DOCKERFILE
      FROM ${CI_REGISTRY_IMAGE}:ci-${CI_PIPELINE_ID}
      RUN printf '%s\n' \
        'plugin_dir = "/etc/haproxy-spoa-hub/plugins"' \
        'default_timeout_ms = 500' \
        'log_level = "debug"' \
        '[[listeners]]' \
        'type = "tcp"' \
        'address = "0.0.0.0:12345"' \
        '[[plugins]]' \
        'name = "noop"' \
        'library = "libnoop_plugin.so"' \
        'messages = ["check-request"]' \
        > /etc/haproxy-spoa-hub/config.toml
      DOCKERFILE
    - docker run -d --name smoke-hub smoke-hub
    # Wait for the TCP listener to be ready
    - |
      for i in $(seq 1 15); do
        if [ "$(docker inspect -f '{{.State.Running}}' smoke-hub 2>/dev/null)" != "true" ]; then
          echo "FAIL: container exited unexpectedly"
          docker logs smoke-hub
          exit 1
        fi
        if docker logs smoke-hub 2>&1 | grep -q "listening"; then
          echo "Hub is listening"
          break
        fi
        if [ "$i" -eq 15 ]; then
          echo "FAIL: hub did not start listening within 15s"
          docker logs smoke-hub
          exit 1
        fi
        sleep 1
      done
    # Verify plugin was loaded
    - docker logs smoke-hub 2>&1 | grep "plugin loaded"
    - echo "PASS - smoke test"
    - docker stop smoke-hub

smoke-amd64:
  extends: .smoke-test
  tags:
    - saas-linux-small-amd64

smoke-arm64:
  extends: .smoke-test
  tags:
    - saas-linux-small-arm64
  # Workaround for MTU mismatch on GitLab hosted arm64 runners
  services:
    - name: docker:${DOCKER_VERSION}-dind
      alias: docker
      command: ["--mtu=1400"]

integration:
  stage: build
  image: docker:${DOCKER_VERSION}
  extends: .docker-dind
  tags:
    - saas-linux-xlarge-amd64
  needs:
    - job: build-docker
      artifacts: false
      optional: true
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - !reference [.rules-code, rules]
  timeout: 15 minutes
  interruptible: true
  script:
    - apk add --no-cache make bash curl
    - cd tests/integration
    - make test
  artifacts:
    when: on_failure
    expire_in: 1 week

# =============================================================================
# Sign Stage — keyless cosign signing of release artifacts and the container
# image. Runs only on version tags. Identity is provided via GitLab OIDC
# (id_tokens with aud=sigstore); cosign reads SIGSTORE_ID_TOKEN automatically.
# =============================================================================

# Install cosign and syft from the alpine community package repository.
# Trust derives from alpine's package signing infrastructure (the alpine:latest
# image ships the alpine-keys package; apk verifies every download against
# those keys). This avoids the chicken-and-egg of self-validating cosign
# downloads from GitHub Releases — and keeps the upstream version coupling
# out of this repo's variable block.
.install-cosign:
  before_script:
    - apk add --no-cache cosign
    - cosign version

.install-syft:
  before_script:
    - apk add --no-cache syft
    - syft version

# Reusable docker config.json setup so cosign/syft can authenticate to the
# GitLab Container Registry without needing docker CLI installed.
.docker-registry-auth:
  before_script:
    - mkdir -p ~/.docker
    - |
      auth=$(printf '%s' "${CI_REGISTRY_USER}:${CI_REGISTRY_PASSWORD}" | base64 -w0)
      cat > ~/.docker/config.json <<EOF
      {"auths": {"${CI_REGISTRY}": {"auth": "${auth}"}}}
      EOF

# Sign every file under ./artifacts (per-arch hub binary + example plugin .so
# files). Output: <file>.cosign.bundle next to each input.
sign-blobs:
  stage: sign
  image: alpine:latest
  tags:
    - saas-linux-small-amd64
  needs:
    - build-amd64
    - build-arm64
    - build-armv7
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
  variables:
    COSIGN_YES: "true"
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  before_script:
    - !reference [.install-cosign, before_script]
  script:
    - scripts/sign-release-artifacts.sh
  artifacts:
    paths:
      - artifacts/
    expire_in: 1 week

# Sign the published multi-arch container image manifest by digest. Always
# sign by digest (sha256:...), never by tag — tags are mutable.
sign-image:
  stage: sign
  image: alpine:latest
  tags:
    - saas-linux-small-amd64
  needs:
    - build-docker
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
  variables:
    COSIGN_YES: "true"
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  before_script:
    - !reference [.install-cosign, before_script]
    - !reference [.docker-registry-auth, before_script]
    - apk add --no-cache jq
  script:
    - DIGEST=$(jq -r '."containerimage.digest"' metadata.json)
    - echo "Signing ${CI_REGISTRY_IMAGE}@${DIGEST}"
    - cosign sign --yes "${CI_REGISTRY_IMAGE}@${DIGEST}"

# Generate a CycloneDX SBOM from the published image and attach it as a
# cosign attestation (in-toto, DSSE-signed via the same keyless identity).
attest-sbom-image:
  stage: sign
  image: alpine:latest
  tags:
    - saas-linux-small-amd64
  needs:
    - build-docker
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
  variables:
    COSIGN_YES: "true"
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  before_script:
    - !reference [.install-cosign, before_script]
    - !reference [.install-syft, before_script]
    - !reference [.docker-registry-auth, before_script]
    - apk add --no-cache jq
  script:
    - DIGEST=$(jq -r '."containerimage.digest"' metadata.json)
    - syft scan "${CI_REGISTRY_IMAGE}@${DIGEST}" -o cyclonedx-json=sbom.cdx.json
    - cosign attest --yes --type cyclonedx --predicate sbom.cdx.json
        "${CI_REGISTRY_IMAGE}@${DIGEST}"
  artifacts:
    paths:
      - sbom.cdx.json
    expire_in: 1 month

# =============================================================================
# Upload Stage — push release artifacts (binaries, .so, .sha256, .cosign.bundle,
# combined SHA256SUMS) to the GitLab Generic Package Registry. The release-cli
# step that follows references these stable URLs as asset links.
# =============================================================================

upload-artifacts:
  stage: upload
  image: alpine:latest
  tags:
    - saas-linux-small-amd64
  needs:
    - sign-blobs
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
  before_script:
    - apk add --no-cache curl bash coreutils
  script:
    - |
      cd artifacts
      : > SHA256SUMS
      for f in *; do
        [ -f "$f" ] || continue
        case "$f" in
          *.sha256 | *.cosign.bundle | SHA256SUMS) continue ;;
        esac
        sha256sum "$f" >> SHA256SUMS
      done
      cd ..
    - scripts/upload-release-artifacts.sh

# =============================================================================
# Release Stage (triggered by v* tags)
# =============================================================================

publish-crate:
  stage: release
  image: rust:${RUST_VERSION}-bookworm
  tags:
    - saas-linux-small-amd64
  needs: []
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
  script:
    - |
      LOCAL_VERSION=$(cargo metadata --no-deps --format-version=1 \
        | python3 -c "import sys,json; pkgs=json.load(sys.stdin)['packages']; print(next(p['version'] for p in pkgs if p['name']=='haproxy-spoa-hub-plugin-api'))")
      PUBLISHED=$(curl -sf "https://crates.io/api/v1/crates/haproxy-spoa-hub-plugin-api" \
        | python3 -c "import sys,json; print(json.load(sys.stdin)['crate']['max_version'])" 2>/dev/null || echo "0.0.0")
      echo "Local: ${LOCAL_VERSION}, Published: ${PUBLISHED}"
      if [ "${LOCAL_VERSION}" = "${PUBLISHED}" ]; then
        echo "Version ${LOCAL_VERSION} already published, skipping"
      else
        cargo publish -p haproxy-spoa-hub-plugin-api
      fi

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  tags:
    - saas-linux-small-amd64
  needs:
    - upload-artifacts
    - sign-image
    - attest-sbom-image
  rules:
    - if: $CI_COMMIT_TAG =~ /^v.*/
  variables:
    GIT_DEPTH: 0
  script:
    - |
      VERSION="${CI_COMMIT_TAG#v}"
      awk -v ver="${VERSION}" '
        /^## \[/ { if (found) exit; if (index($0, "[" ver "]")) found=1 }
        found { print }
      ' CHANGELOG.md > release-notes.md
      if [ ! -s release-notes.md ]; then
        echo "Release ${CI_COMMIT_TAG}" > release-notes.md
      fi
      cat release-notes.md
  release:
    tag_name: $CI_COMMIT_TAG
    name: "$CI_COMMIT_TAG"
    description: ./release-notes.md
    assets:
      links:
        - name: "Docker Image"
          url: "https://gitlab.com/haproxy-haptic/haproxy-spoa-hub/container_registry"
          link_type: image
        # Combined sha256 manifest for batch verification: `sha256sum -c SHA256SUMS`.
        - name: "SHA256SUMS"
          url:  "${PKG_REGISTRY_URL}/SHA256SUMS"
          link_type: other
        # ---------- amd64 ----------
        - name: "haproxy-spoa-hub-amd64-glibc${GLIBC_VERSION}"
          url:  "${PKG_REGISTRY_URL}/haproxy-spoa-hub-amd64-glibc${GLIBC_VERSION}"
